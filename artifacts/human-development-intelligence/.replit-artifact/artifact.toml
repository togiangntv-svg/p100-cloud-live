kind = "mobile"
previewPath = "/"
title = "100 — Human Development Intelligence"
description = "Prototype mobile native cho iPhone và Android của 100 — Trí tuệ phát triển con người. Dữ liệu DEMO/LOCAL, tập trung vào vòng GOAL → CONTEXT → UNDERSTANDING → DECISION → ACTION → OUTCOME → LEARNING → REVIEW, quyền kiểm soát của người dùng và an toàn phát triển con người."
version = "1.0.0"
id = "artifacts/human-development-intelligence"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20383

[services.development]
run = "pnpm --filter @workspace/human-development-intelligence run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/human-development-intelligence", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/human-development-intelligence", "run", "serve" ]

[services.env]
PORT = "20383"
BASE_PATH = "/"
